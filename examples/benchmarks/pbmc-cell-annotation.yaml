schema_version: 1.0.0
metadata:
  id: pbmc-cell-annotation
  title: PBMC Cell-Type Annotation
  description: >-
    Evaluate whether an agent can construct a reproducible single-cell RNA-seq
    annotation workflow and assign biologically defensible cell-type labels to
    peripheral blood mononuclear cells.
  version: 1.0.0
  authors:
    - name: Agent Evals Single-Cell Working Group
      institution: Open Research Infrastructure Consortium
      role: benchmark authors
  license: CC-BY-4.0
  tags: [single-cell, annotation, pbmc, transcriptomics]
  domains: [computational-biology, cell-atlas]
  references: [pbmc68k-paper, scanpy-paper, leiden-paper]
references:
  - id: pbmc68k-paper
    title: "The circulating immune cell atlas: PBMC 68k"
    authors: [Zheng et al.]
    doi: 10.1038/nmeth.4292
  - id: scanpy-paper
    title: "Scanpy: large-scale single-cell gene expression data analysis"
    authors: [Wolf et al.]
    doi: 10.1101/2017.08.11.206904
  - id: leiden-paper
    title: "From Louvain to Leiden: guaranteeing well-connected communities"
    authors: [Traag et al.]
    doi: 10.1038/s41598-019-41695-z
datasets:
  - id: pbmc68k
    name: 10x Genomics PBMC 68k
    description: >-
      Public peripheral blood mononuclear cell transcriptomes with a curated
      cell-type label set suitable for unsupervised and supervised annotation.
    source: 10x Genomics public datasets
    source_url: https://www.10xgenomics.com/resources/datasets/8-k-pbm-cs-from-a-healthy-donor-1-standard-1-1-0
    organism: Homo sapiens
    modality: scRNA-seq
    format: h5ad
    citation: [pbmc68k-paper]
    license: public research use
    expected_observations:
      cells: 68579
      genes: 32738
      labeled_cell_types: 11
    recommended_tasks: [cell-annotation]
observations:
  - id: current-anndata
    name: Current AnnData object
    description: Expression matrix and cell metadata after the latest accepted action.
    type: anndata
    source: task workspace
    required: true
    schema: {layers: [X], obs: [cell_id], var: [gene_id]}
  - id: qc-statistics
    name: Quality-control statistics
    description: >-
      Compact distribution summaries before filtering and a per-cell QC table
      recording retained/rejected status and filter reason after filtering.
    type: table
    source: qc action output
    required: true
    schema: {columns: [total_counts, n_genes_by_counts, pct_counts_mt, qc_pass, qc_fail_reason]}
  - id: pipeline-history
    name: Pipeline history
    description: Ordered record of accepted actions, parameters, and artifact references.
    type: event_log
    source: environment
    required: true
  - id: available-tools
    name: Available tools
    description: Interfaces exposed by the execution environment for this task.
    type: tool_catalog
    source: environment
    required: true
actions:
  - id: qc
    name: Quality control
    purpose: Select and apply a reproducible cell- and gene-level quality-control strategy.
    parameters:
      - name: method
        description: >-
          QC strategy. fixed_threshold uses explicit cutoffs; mitochondrial_filter
          focuses on high mitochondrial content; adaptive_quantile derives cutoffs
          from this dataset; mad_outlier removes robust distributional outliers.
        type: enum
        required: false
        default: fixed_threshold
        choices: [fixed_threshold, mitochondrial_filter, adaptive_quantile, mad_outlier]
      - name: min_genes
        description: Minimum number of detected genes per cell.
        type: integer
        required: false
        default: 200
        minimum: 0
      - name: max_mito_fraction
        description: Maximum mitochondrial transcript fraction.
        type: number
        required: false
        default: 0.2
        minimum: 0
        maximum: 1
      - name: max_genes
        description: Optional maximum number of detected genes per cell, useful for doublet-like outliers.
        type: integer
        required: false
        minimum: 0
      - name: min_cells
        description: Minimum number of retained cells in which a gene must be detected.
        type: integer
        required: false
        default: 0
        minimum: 0
      - name: min_genes_quantile
        description: Lower quantile used by adaptive_quantile for detected genes.
        type: number
        required: false
        default: 0.05
        minimum: 0
        maximum: 1
      - name: max_mito_quantile
        description: Upper quantile used by adaptive_quantile for mitochondrial percentage.
        type: number
        required: false
        default: 0.95
        minimum: 0
        maximum: 1
      - name: mad_multiplier
        description: Robust MAD multiplier used by mad_outlier.
        type: number
        required: false
        default: 3
        minimum: 0
    required_inputs: [current-anndata]
    expected_outputs: [qc-table]
    estimated_cost: {cpu_seconds: 30, memory_mb: 2048, complexity: linear_in_cells}
  - id: normalize
    name: Normalize and log transform
    purpose: Produce a comparable expression representation for downstream analysis.
    parameters:
      # Optional here and required on the differential-expression benchmark, which
      # is the difference between a stage this task takes for granted and one it
      # asks the agent to justify. Both catalogs offer the same two choices so a
      # single normalization decision validates against either.
      - name: method
        description: Normalization method.
        type: enum
        required: false
        default: library_size_log1p
        choices: [library_size_log1p, median_counts_log1p]
      - name: target_sum
        description: "Library-size target per cell; permitted only with library_size_log1p."
        type: number
        required: false
        minimum: 1
      - name: inplace
        description: Keep the normalized AnnData object as the current pipeline state.
        type: boolean
        required: false
        default: true
    required_inputs: [current-anndata, qc-statistics]
    expected_outputs: [normalized-anndata]
    estimated_cost: {cpu_seconds: 45, memory_mb: 4096, complexity: linear_in_nonzero_entries}
  - id: pca
    name: Principal component representation
    purpose: Build a compact representation of the normalized expression matrix.
    parameters:
      - name: n_components
        description: Number of principal components to retain.
        type: integer
        required: false
        default: 50
        minimum: 2
    required_inputs: [current-anndata]
    expected_outputs: [pca-embedding]
    estimated_cost: {cpu_seconds: 90, memory_mb: 4096, complexity: linear_in_cells}
  - id: cluster
    name: Cluster cells
    purpose: Group cells into unsupervised clusters without consulting reference labels.
    parameters:
      - name: resolution
        description: Community-detection resolution; higher values yield more clusters.
        type: number
        required: false
        default: 1.0
        minimum: 0.1
        maximum: 5
      - name: n_neighbors
        description: Neighborhood size used to build the cell graph.
        type: integer
        required: false
        default: 15
        minimum: 2
    required_inputs: [current-anndata]
    expected_outputs: [cluster-table]
    estimated_cost: {cpu_seconds: 120, memory_mb: 8192, complexity: linear_in_cells}
  - id: marker-genes
    name: Find marker genes
    purpose: Identify genes that distinguish candidate cell populations.
    parameters:
      - name: group_key
        description: Observation column defining candidate groups.
        type: string
        required: true
    required_inputs: [current-anndata, cluster-table]
    expected_outputs: [marker-table]
    estimated_cost: {cpu_seconds: 180, memory_mb: 8192, complexity: quadratic_in_groups}
  - id: annotate
    name: Annotate cell types
    purpose: Assign a cell-type label to every retained cell with supporting evidence.
    parameters:
      - name: method
        description: Annotation strategy represented by the supplied marker evidence.
        type: enum
        required: false
        default: marker_based
        choices: [marker_based]
      - name: label_vocabulary
        description: Controlled vocabulary of permitted cell-type labels.
        type: list[string]
        required: true
        constraints: {must_cover_all_cells: true}
      - name: markers
        description: >-
          Mapping of each cell-type label to the marker genes that justify it.
          Annotation is scored against held-out reference labels, so the marker
          evidence must be supplied by the agent rather than read from the data.
        type: object
        required: true
      - name: group_key
        description: Agent-produced cluster column to label; defaults to the clustering output.
        type: string
        required: false
    required_inputs: [current-anndata, cluster-table, marker-table]
    expected_outputs: [annotated-anndata]
    estimated_cost: {cpu_seconds: 60, memory_mb: 4096, complexity: analyst_defined}
metrics:
  - id: annotation-accuracy
    name: Cell-type annotation accuracy
    description: Fraction of held-out cells assigned their reference cell type.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: identity
    contributes_to_reward: true
  - id: annotation-macro-f1
    name: Macro F1
    description: Class-balanced F1 over the reference cell-type vocabulary.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: identity
    contributes_to_reward: true
  - id: annotation_ari
    name: Adjusted Rand index
    description: Agreement between observed cell-type labels and the available cluster labels.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    normalization: identity
  - id: annotation_nmi
    name: Normalized mutual information
    description: Information agreement between observed cell-type labels and cluster labels.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    normalization: identity
  - id: annotation_silhouette
    name: Annotation silhouette
    description: Separation of available cluster labels in the PCA or UMAP representation.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    normalization: identity
  - id: cell_annotation.macro_f1
    name: Versioned annotation macro F1
    description: Class-balanced F1 from the versioned scientific metric registry.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: primary
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.mcc
    name: Versioned annotation MCC
    description: Multiclass Matthews correlation coefficient.
    direction: higher_is_better
    expected_range: {minimum: -1, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: primary
    native_min: -1
    native_max: 1
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.balanced_accuracy
    name: Versioned balanced accuracy
    description: Class-balanced accuracy over reference labels.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: primary
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.rare_recall
    name: Versioned rare-class recall
    description: Recall for the least frequent reference classes.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: primary
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.accuracy
    name: Versioned annotation accuracy
    description: Exact cell-level agreement with reference labels.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: primary
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.ece
    name: Versioned expected calibration error
    description: Calibration error when candidate confidence is available.
    direction: lower_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: secondary
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.per_class_precision
    name: Per-class precision diagnostic
    description: Per-class precision vector retained as diagnostic evidence.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: none
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: diagnostic
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.per_class_recall
    name: Per-class recall diagnostic
    description: Per-class recall vector retained as diagnostic evidence.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: none
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: diagnostic
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.confusion_matrix
    name: Confusion matrix diagnostic
    description: Label confusion matrix retained as diagnostic evidence.
    direction: higher_is_better
    aggregation: none
    normalization: none
    version: '1.0'
    category: cell_annotation
    role: diagnostic
    computation_backend: sklearn
    required_artifacts: [prediction]
  - id: cell_annotation.coverage
    name: Annotation coverage diagnostic
    description: Fraction of candidate cells with a non-null label.
    direction: higher_is_better
    expected_range: {minimum: 0, maximum: 1}
    aggregation: mean
    normalization: bounded
    version: '1.0'
    category: cell_annotation
    role: diagnostic
    computation_backend: native
    required_artifacts: [prediction]
  - id: runtime
    name: Wall-clock runtime
    description: Elapsed execution time for the complete task.
    direction: lower_is_better
    expected_range: {minimum: 0}
    aggregation: sum
    normalization: log_scale
    unit: seconds
    contributes_to_reward: true
metric_groups:
  - group_id: cell_annotation_quality
    aggregation: weighted_mean
    minimum_required: 5
    contributes_to_primary: true
    metrics:
      - {metric_id: cell_annotation.macro_f1, weight: 0.35, role: primary}
      - {metric_id: cell_annotation.mcc, weight: 0.25, role: primary}
      - {metric_id: cell_annotation.rare_recall, weight: 0.20, role: primary}
      - {metric_id: cell_annotation.balanced_accuracy, weight: 0.10, role: primary}
      - {metric_id: cell_annotation.accuracy, weight: 0.10, role: primary}
  - group_id: cell_annotation_calibration
    aggregation: weighted_mean
    minimum_required: 1
    contributes_to_primary: false
    metrics:
      - {metric_id: cell_annotation.ece, weight: 1.0, role: secondary}
decision_evaluation:
  qc_strategy:
    allowed_methods: [fixed_threshold, mitochondrial_filter, adaptive_quantile, mad_outlier]
    expected_inputs: [current-anndata, qc-statistics]
    alternatives: [mitochondrial_filter, adaptive_quantile, mad_outlier]
    metrics: [artifact_removal, biological_retention, rare_population_preservation]
    parameter_ranges:
      min_genes: {minimum: 0, maximum: 2000}
      max_mito_fraction: {minimum: 0, maximum: 1}
  normalization:
    allowed_methods: [library_size_log1p, median_counts_log1p]
    expected_inputs: [current-anndata, qc-statistics]
    alternatives: [median_counts_log1p]
    metrics: [library_size_stability, downstream_separation]
    parameter_ranges:
      target_sum: {minimum: 1, maximum: 1000000}
  annotation:
    allowed_methods: [marker_based]
    expected_inputs: [normalized-anndata, marker-table]
    alternatives: []
    metrics: [macro_f1, rare_recall, calibration]
rewards:
  - id: annotation-reward
    name: Annotation utility reward
    description: Favor accurate, class-balanced annotations while penalizing slow workflows.
    components:
      - {metric: annotation-accuracy, weight: 0.55}
      - {metric: annotation-macro-f1, weight: 0.35}
      - {metric: runtime, weight: -0.10, transform: normalized_penalty}
    aggregation: weighted_sum
artifacts:
  - id: qc-table
    name: Quality-control table
    description: Per-cell QC statistics, filtering decisions, selected method, and derived thresholds.
    kind: table
    format: parquet
    produced_by: [qc]
    validation:
      - {name: required-columns, description: QC columns and filtering decisions are present, rule: "columns include total_counts,n_genes_by_counts,pct_counts_mt,qc_pass,qc_fail_reason"}
  - id: normalized-anndata
    name: Normalized AnnData
    description: Filtered and normalized expression object used by annotation.
    kind: anndata
    format: h5ad
    produced_by: [normalize]
    validation:
      - {name: finite-expression, description: Expression values are finite, rule: X contains no NaN or infinite values}
  - id: pca-embedding
    name: PCA embedding
    description: Principal-component representation of the normalized matrix.
    kind: embedding
    format: h5ad
    produced_by: [pca]
    validation:
      - {name: finite-embedding, description: Embedding values are finite, rule: X_pca contains no NaN or infinite values}
  - id: cluster-table
    name: Cluster assignment table
    description: One unsupervised cluster assignment per retained cell.
    kind: table
    format: parquet
    produced_by: [cluster]
    validation:
      - {name: multiple-clusters, description: At least two clusters were recovered, rule: "cluster column has 2 or more distinct values"}
  - id: marker-table
    name: Marker-gene table
    description: Ranked marker evidence for candidate cell populations.
    kind: table
    format: parquet
    produced_by: [marker-genes]
  - id: annotated-anndata
    name: Annotated AnnData
    description: Final object containing one cell-type label per retained cell.
    kind: anndata
    format: h5ad
    produced_by: [annotate]
    validation:
      # Targets predicted_label, not cell_type: cell_type is a reserved reference
      # column that an agent is refused permission to write, so a rule asking for
      # it could only ever be satisfied by the answer key.
      - {name: complete-labels, description: Every retained cell has one allowed label, rule: predicted_label is non-null and belongs to label_vocabulary}
constraints:
  cpu_only: true
  internet_access: false
  max_runtime_seconds: 1800
  max_memory_mb: 16384
  allowed_python_packages: [anndata, numpy, pandas, scanpy, scipy]
  deterministic: true
  random_seed: 42
# Declared so the controller is enforcing a number this benchmark chose rather
# than a harness fallback. The typed catalog is eight actions and a step may
# legitimately be retried, so twenty leaves room for a retry per stage without
# letting a loop spend an entire budget.
#
# `max_wall_time_seconds` deliberately exceeds `constraints.max_runtime_seconds`:
# the constraint bounds time inside the executor, this bounds the whole run
# including the agent's deliberation, which is the larger quantity.
#
# `max_repeated_decisions` is left undeclared. On this tier a decision signature
# is an action name plus typed parameters, and re-running `cluster` at the same
# resolution against a dataset a previous step changed is legitimately different
# work.
#
# `stagnation_window` is left undeclared on purpose, and this is a blocker rather
# than a preference. The biology domain is a geometric mean that includes
# `cell_annotation.rare_recall`, which currently normalizes to exactly 0.0 for
# every agent whose label spellings do not match the reference vocabulary. A
# single 0.0 annihilates the product, so `S_t` is pinned at 0.0 for the whole run
# and every `dS` is a measured 0.0 -- verified on a real run, where all five
# measured deltas were 0.0 while `clustering.ari` was 0.81 and moving. The
# controller cannot tell a degenerate scale from a genuinely flat one, so arming
# the window here would cut off correct runs. Arm it once the metric is fixed.
cutoff:
  max_steps: 20
  max_wall_time_seconds: 3600
  max_consecutive_failures: 3
tasks:
  - id: cell-annotation
    name: PBMC cell-type annotation
    objective: Recover biologically meaningful cell types from PBMC expression profiles.
    end_goal: Produce a reproducible, biologically defensible cell-type assignment for the retained cells, supported by marker evidence and a validated final object.
    description: >-
      Starting from the public PBMC expression matrix and declared observations,
      produce a fully labeled AnnData object with marker-based evidence.
    datasets: [pbmc68k]
    observations: [current-anndata, qc-statistics, pipeline-history, available-tools]
    allowed_actions: [qc, normalize, pca, cluster, marker-genes, annotate]
    metrics: [annotation-accuracy, annotation-macro-f1, runtime]
    reward_strategy: annotation-reward
    artifacts:
      - qc-table
      - normalized-anndata
      - pca-embedding
      - cluster-table
      - marker-table
      - annotated-anndata
    termination:
      - {name: successful-completion, description: All retained cells have valid labels and required artifacts exist., condition: required artifacts validate successfully}
      - {name: resource-limit, description: Stop when the benchmark resource budget is exhausted., condition: runtime exceeds constraints.max_runtime_seconds}
