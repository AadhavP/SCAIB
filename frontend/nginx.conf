server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA assets; hashed filenames are safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API and server-sent event streams go to the backend service.
    location /v1/ {
        # Generated at container start from AGENT_EVALS_API__API_KEY. The
        # credential is attached here, server-side, because a browser cannot set
        # headers on an EventSource and a key in the JS bundle would be public.
        include /etc/nginx/snippets/api-auth.conf;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # SSE: disable buffering so events flush immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri /index.html;
    }
}
