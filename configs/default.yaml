app_name: "agent-evals"
environment: "development"
debug: true
log_level: "INFO"
log_json: false

api:
  host: "127.0.0.1"
  port: 8000
  workers: 1
  execute_jobs_in_process: true
  # Set AGENT_EVALS_API__API_KEY (or add api_key here) when exposing the API beyond localhost.
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:8000"

storage:
  data_dir: "./data"
  reports_dir: "./reports_output"
  cache_dir: "./.cache"
  # Durable API control-plane state. Place this file on persistent storage in
  # production; use an explicit manager path of :memory: in unit tests.
  job_db_path: "./data/evaluation_jobs.sqlite3"

sandbox:
  timeout_seconds: 300
  max_memory_gb: 16
  allowed_imports:
    - "scanpy"
    - "anndata"
    - "numpy"
    - "pandas"
    - "scipy"
